name: Build SMAPILoader APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Apply custom Mono runtime if available
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(find . -type f -name SMAPIGameLoader.csproj -not -path "*/obj/*" -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo "SMAPIGameLoader.csproj not found. Upload extracted source files, not only the ZIP." >&2; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          CUSTOM="$(dirname "$ROOT")/SharedLibs/native/arm64-v8a/libmonosgen-2.0.so"
          if [ -f "$CUSTOM" ]; then
            RUNTIME=$(find "$HOME/.dotnet/packs" "/usr/share/dotnet/packs" -path '*/Microsoft.NETCore.App.Runtime.Mono.android-arm64/*/runtimes/android-arm64/native/libmonosgen-2.0.so' -print -quit 2>/dev/null || true)
            if [ -z "$RUNTIME" ]; then
              echo 'Custom Mono runtime target not found' >&2
              exit 1
            fi
            sudo cp "$CUSTOM" "$RUNTIME"
          else
            echo 'WARNING: custom Mono runtime not present; resulting APK may not run SMAPI correctly.'
          fi

      - name: Prepare game DLL dependencies
        shell: bash
        env:
          GAME_DLLS_URL: ${{ secrets.GAME_DLLS_URL }}
        run: |
          set -euo pipefail
          DEST="$(dirname "$PROJECT_ROOT")/../SMAPI-Android-1.6/src/DependenciesDll"
          mkdir -p "$DEST"
          if [ -n "$GAME_DLLS_URL" ]; then
            curl --fail --location --retry 3 --output /tmp/game-dlls.zip "$GAME_DLLS_URL"
            unzip -j -o /tmp/game-dlls.zip 'MonoGame.Framework.dll' 'StardewValley.dll' 'StardewValley.GameData.dll' -d "$DEST"
          fi
          missing=0
          for dll in MonoGame.Framework.dll StardewValley.dll StardewValley.GameData.dll; do
            if [ ! -s "$DEST/$dll" ]; then
              echo "::error::Missing $dll. Extract your legally owned Android game DLLs and provide a private ZIP using the GAME_DLLS_URL repository secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Publish APK
        run: dotnet publish "$PROJECT_ROOT/SMAPIGameLoader.csproj" -f net9.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAPILoader-Android
          path: "**/SMAPIGameLoader/bin/Release/**/*.apk"
          if-no-files-found: error
